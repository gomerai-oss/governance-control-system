name: Mission Agent

# Starts the agent a mission waits on (A2 build or A3 review) and opens its PR as
# that agent's GitHub App. The mission router starts this workflow on every handoff,
# and every 10 minutes while the mission clock is on, as the fallback that replaced
# this workflow's own schedule (MISSION-DISPATCH-001 Amendment 058). Every run
# re-derives the missions itself, so a trigger is only a nudge and nothing in an
# event payload is read.
# Spec: tools/agent_workflow/specs/MISSION-DISPATCH-001.md
#
# Security model (no job holds both agent-written content and a credential that
# could act on it):
# - plan: read-only token. Lists the jobs due from the router's own derivation,
#   skipping any lane another run of this workflow still owns.
# - checks (A3 only): its own VM with no credential at all. Runs the plan's
#   HITL-approved checks on the commit A3 reviews as a separate unprivileged
#   account, killed before anything is uploaded; the results are evidence for A3.
#   It also runs the landing branch's own checks (config.json landing_checks) on
#   that commit merged onto the landing branch; an A3 PASS is published only when
#   each one exited 0 (MISSION-DISPATCH-001 Amendment 048).
# - agent: its own VM. The runtime (pinned by SHA-256) gets only its model login
#   (environment mission-runtime); the read-only token is used in earlier steps and
#   is never in the agent's process tree. It can only edit files in the checkout.
#   A change containing the model login is refused; the agent log is scrubbed of it.
#   Its way out is the egress proxy (blast radius, MISSION-DISPATCH-001 §3h). Under
#   "enforce" it runs as its own account, mission-agent, whose network reaches only that
#   proxy, with the runtimes, the tooling and the job outside the runner's home.
# - publish: a separate VM running only the default branch's code. Its environment
#   (mission-agent-<agent>, deployable from the default branch only) holds that one
#   agent's App key. It re-checks the patch on a fresh clone, then pushes the stage
#   branch and opens the PR as the App. It never merges.
# - report: if a due job did not end in an open PR, it says so on the tracking
#   issue. The next run starts it again; after 3 failures in a row the router
#   records the stage as blocked until HITL comments /mission retry.
# - land: when every mission of a stack that lands as a whole has passed, it opens
#   the PR from the stack branch into the default branch as an A3 agent's App
#   (environment mission-agent-<agent>). No agent content runs there; the router
#   checks the stack and merges it.
# - perform: only on HITL's /mission perform. Checks the command and the run's drafted
#   list with the read token, claims the list, then makes exactly those calls through the
#   app gateway as the service principal in a step with no token, only the listed apps'
#   keys (environment mission-runtime, no model login, no agent). Amendment 032.
# - secscan: the security scan (SECURITY-SCAN-SPEC-001; Amendment 036), only while config.json "security_scan" is
#   not "off". Its own VM, environment mission-secscan (deployable from the default branch only), which holds only
#   OPENAI_API_KEY. The read token clones the PR's exact head in one step; the key is given only to the scan step,
#   where the egress proxy holds it and the scanner (pinned with its whole tree, Amendment 034) runs as the agent's
#   own account with a stand-in, its one way out the proxy (Amendment 035). No token there.
# - secscan report: a separate VM with no key and none of the scanner's code. It reads the scan's result strictly,
#   sets the security-scan check on the head and posts the findings through the quarantine. No result is red.
# - No agent App may hold the Workflows permission, so no agent can change this file.

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions: {}

env:
  PYTHONPATH: tooling/tools/agent_workflow
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # Runtimes, pinned by exact version and SHA-256 of the package. Changing either is a reviewed PR.
  CLAUDE_CODE_VERSION: 2.1.305
  CLAUDE_CODE_SHA256: 6d123d2953b9623e5f3e399f9984dd137dcad992aab2f810c0eac0040cae894a
  CURSOR_CLI_VERSION: 2026.10.19-6bbf2c4
  CURSOR_CLI_SHA256: cf80cc18d8b33bf33e762353977ca1868cfc45290c92c0ffdcef83bb8b37b44f

jobs:
  plan:
    name: plan
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/mission retry')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Plans run one at a time, so each sees every lane the others started.
    concurrency:
      group: mission-agent-plan
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      land_count: ${{ steps.plan.outputs.land_count }}
      land_matrix: ${{ steps.plan.outputs.land_matrix }}
      scan_count: ${{ steps.plan.outputs.scan_count }}
      scan_matrix: ${{ steps.plan.outputs.scan_matrix }}
      app_gateway: ${{ steps.plan.outputs.app_gateway }}  # Amendment 054: an app's key reaches the agent job only when on
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: List the jobs due
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m mission_dispatch plan --repo "$GITHUB_REPOSITORY"

      # MISSION-DISPATCH-001 §3l item 4 (ring 4): policy CI's newest evidence graph from a push to the default branch,
      # every landing checked there against GitHub's own record, handed to this run's agent jobs. A failure is a
      # warning: trace then reports every landing as "not checked", never "proven".
      - name: Fetch policy CI's verified evidence graph
        if: steps.plan.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B -m mission_dispatch provenance-fetch --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/provenance"

      - name: Hand it to the agent jobs
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance
          path: ${{ runner.temp }}/provenance
          if-no-files-found: ignore
          retention-days: 1

  # Amendment 054: before any work starts, each lane's seat mints the App token publish will need, with the same
  # permissions, and lets it go unused (the action revokes it at the end of the job). A seat whose App cannot (its
  # installation or permissions) records why, and the lane's checks and agent do not run: five live runs did all
  # their work and then could not publish. Only the default branch's tooling runs here (the substrate check), and the
  # job's own token can only read.
  publisher:
    name: publisher ${{ matrix.job.mission_id }} ${{ matrix.job.role }} r${{ matrix.job.round }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mission-agent-${{ matrix.job.agent }}
    permissions:
      contents: read  # check out this repository's tooling, for the substrate check
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Name this repository
        id: repo
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint the agent's App token as publish will (this repository, contents + pull requests only)
        id: token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Record that this seat cannot publish
        if: failure()
        env:
          AGENT: ${{ matrix.job.agent }}
        run: |
          install -d "$RUNNER_TEMP/cannot-publish"
          echo "publish: the $AGENT seat's App could not mint a token with contents and pull-requests write on this repository, so no work was started; its installation or permissions need HITL (this run's publisher job shows GitHub's answer)" > "$RUNNER_TEMP/cannot-publish/refusal.txt"

      - name: Hand the record to the lane's jobs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cannot-publish-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/cannot-publish
          if-no-files-found: ignore
          retention-days: 1

  checks:
    name: checks ${{ matrix.job.mission_id }} ${{ matrix.job.role }} r${{ matrix.job.round }}
    needs: [plan, publisher]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Amendment 052: the plan's checks and a full suite as a landing check
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      JOB: ${{ toJSON(matrix.job) }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Start this job's evidence chain (MISSION-DISPATCH-001 §3m, ring 6; the agent never sees it)
        env:
          LANE: ${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/evidence"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_RUN=gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-checks-$LANE" >> "$GITHUB_ENV"

      - name: Fetch the publisher job's record (Amendment 054)
        continue-on-error: true  # none unless this seat's App could not mint its token
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cannot-publish-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/cannot-publish

      - name: Is this lane still due?
        id: due
        if: matrix.job.role == 'A3'  # the plan's checks, and the landing branch's own (Amendment 048)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m mission_dispatch due --repo "$GITHUB_REPOSITORY"
          --not-started "$RUNNER_TEMP/not-started/not-started.txt"
          --blocked-by "$RUNNER_TEMP/cannot-publish/refusal.txt"

      - name: Hand a not-started record to the agent job (GitHub could not be read; Amendment 050)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: not-started-checks-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/not-started
          if-no-files-found: ignore
          retention-days: 1

      - name: Check out the commit under review
        if: steps.due.outputs.due == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.job.base_sha }}
          path: review
          fetch-depth: 0  # the landing branch's head, for the landing tree (Amendment 048)
          persist-credentials: false

      # Amendment 048: the commit under review merged onto its landing branch, as the landing PR's checks will see
      # it. Only git runs (hooks off); nothing is built when config.json names no landing_checks.
      - name: Merge the commit under review onto its landing branch (landing checks)
        if: steps.due.outputs.due == 'true'
        run: python3 -m mission_dispatch landing-tree --review review --out landing --info "$RUNNER_TEMP/landing.json"

      # The code under review must not reach the runner's processes: their environment
      # holds the token Actions uses for artifacts, which could plant a forged change.
      - name: Run the plan's checks as an unprivileged account (no credential)
        if: steps.due.outputs.due == 'true'
        run: |
          sudo useradd --create-home --shell /bin/bash mission-checks
          sudo cp -a review /home/mission-checks/review
          sudo chown -R mission-checks:mission-checks /home/mission-checks/review
          LANDING=()
          if [ -d landing ]; then
            sudo cp -a landing /home/mission-checks/landing
            sudo chown -R mission-checks:mission-checks /home/mission-checks/landing
            LANDING=(--landing-root /home/mission-checks/landing --landing-info "$RUNNER_TEMP/landing.json")
          fi
          python3 -m mission_dispatch checks --root /home/mission-checks/review --out "$RUNNER_TEMP/checks" --run-as mission-checks "${LANDING[@]}"
          sudo pkill -KILL -u mission-checks || true
          if pgrep -u mission-checks >/dev/null; then echo "::error::check processes survived"; exit 1; fi

      - name: Hand the results to the agent job
        if: steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/checks
          if-no-files-found: error
          retention-days: 7

      - name: Keep this job's evidence chain (MISSION-DISPATCH-001 §3m; the store replaces this in part 4)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-checks-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

  # Amendment 052: a landing check that failed on the merged tree is run again on the landing branch's head alone. In
  # a job of its own: no code under review has run on this machine, so it cannot make the baseline fail.
  baseline:
    name: baseline ${{ matrix.job.mission_id }} ${{ matrix.job.role }} r${{ matrix.job.round }}
    needs: [plan, checks]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      JOB: ${{ toJSON(matrix.job) }}
    steps:
      - name: Check out the default branch's tooling
        if: matrix.job.role == 'A3'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        if: matrix.job.role == 'A3'
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Start this job's evidence chain (MISSION-DISPATCH-001 §3m, ring 6)
        if: matrix.job.role == 'A3'
        env:
          LANE: ${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/evidence"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_RUN=gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-baseline-$LANE" >> "$GITHUB_ENV"

      - name: Fetch the checks results
        if: matrix.job.role == 'A3'
        id: fetch
        continue-on-error: true  # none when the lane was not due: nothing to compare
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checks-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/checks

      - name: Did a landing check fail on the merged tree?
        id: due
        if: steps.fetch.outcome == 'success'
        run: python3 -m mission_dispatch baseline-due --checks "$RUNNER_TEMP/checks"

      - name: Check out the landing branch's head alone (no code under review)
        if: steps.due.outputs.due == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.due.outputs.head }}
          path: baseline
          fetch-depth: 0  # the landing checks may read history (the evidence graph)
          persist-credentials: false

      - name: Run the failed landing checks there as an unprivileged account (no credential)
        if: steps.due.outputs.due == 'true'
        run: |
          sudo useradd --create-home --shell /bin/bash mission-checks
          sudo cp -a baseline /home/mission-checks/baseline
          sudo chown -R mission-checks:mission-checks /home/mission-checks/baseline
          python3 -m mission_dispatch baseline --root /home/mission-checks/baseline --checks "$RUNNER_TEMP/checks" --out "$RUNNER_TEMP/baseline" --run-as mission-checks
          sudo pkill -KILL -u mission-checks || true

      - name: Hand the baseline to the publish job
        if: steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseline-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/baseline
          if-no-files-found: error
          retention-days: 7

      - name: Keep this job's evidence chain (MISSION-DISPATCH-001 §3m)
        if: always() && matrix.job.role == 'A3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-baseline-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

  agent:
    name: agent ${{ matrix.job.mission_id }} ${{ matrix.job.role }} r${{ matrix.job.round }}
    needs: [plan, publisher, checks]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: mission-runtime
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      JOB: ${{ toJSON(matrix.job) }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Start this job's evidence chain (MISSION-DISPATCH-001 §3m, ring 6; the agent never sees it)
        env:
          LANE: ${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/evidence"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_RUN=gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-agent-$LANE" >> "$GITHUB_ENV"

      - name: Fetch the checks job's not-started record
        continue-on-error: true  # none unless the checks job could not read GitHub (Amendment 050)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: not-started-checks-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/not-started-checks

      - name: Fetch the publisher job's record (Amendment 054)
        continue-on-error: true  # none unless this seat's App could not mint its token
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cannot-publish-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/cannot-publish

      - name: Is this lane still due?
        id: due
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m mission_dispatch due --repo "$GITHUB_REPOSITORY"
          --not-started "$RUNNER_TEMP/not-started/not-started.txt"
          --after "$RUNNER_TEMP/not-started-checks/not-started.txt"
          --blocked-by "$RUNNER_TEMP/cannot-publish/refusal.txt"

      - name: Hand a not-started record to the report job (GitHub could not be read; Amendment 050)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: not-started-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/not-started
          if-no-files-found: ignore
          retention-days: 1

      - name: Blast radius (observe or enforce)
        id: blast
        if: steps.due.outputs.due == 'true'
        run: |
          python3 -m mission_dispatch blast-mode
          if grep -qx 'mode=enforce' "$GITHUB_OUTPUT"; then
            sudo useradd --create-home --shell /bin/bash mission-agent
            sudo install -d -o root -g root -m 755 /opt/mission-runtime /opt/mission-runtime/bin
            sudo cp -a tooling /opt/mission-tooling
            sudo chown -R root:root /opt/mission-tooling
            sudo chmod -R a+rX,go-w /opt/mission-tooling
            sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 /srv/mission-job
            { echo "root=/srv/mission-job/mission"; echo "run_as=mission-agent"; echo "bin=/opt/mission-runtime/bin"
              echo "pythonpath=/opt/mission-tooling/tools/agent_workflow"; } >> "$GITHUB_OUTPUT"
          else
            { echo "root=$RUNNER_TEMP/mission"; echo "run_as="; echo "bin="; echo "pythonpath=$PYTHONPATH"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the checks results
        if: steps.due.outputs.due == 'true' && matrix.job.role == 'A3'
        continue-on-error: true  # without them A3 is told every check is "not run"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checks-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/checks

      - name: Fetch the verified evidence graph (for the gateway's trace, §3l item 4)
        if: steps.due.outputs.due == 'true'
        continue-on-error: true  # without it every landing is "not checked", never "proven"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provenance
          path: ${{ runner.temp }}/provenance

      - name: Install Claude Code (pinned by SHA-256, checked against the registry's signature)
        if: steps.due.outputs.due == 'true' && matrix.job.runtime == 'claude-code'
        env:
          BIN: ${{ steps.blast.outputs.bin }}
        run: |
          pkg="$RUNNER_TEMP/claude-code.tgz"
          curl -fsSL "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz" -o "$pkg"
          echo "${CLAUDE_CODE_SHA256}  $pkg" | sha256sum --check --strict
          # MISSION-DISPATCH-001 §3l item 2 (ring 4): the npm registry's signature, against the key in pins.json.
          # Under "supply_chain": "enforce" a failure stops here, before anything is installed.
          python3 -B -m mission_dispatch registry-check --runtime claude-code --package "$pkg" \
            --refusal "$RUNNER_TEMP/refusal/refusal.txt"
          if [ -n "$BIN" ]; then  # enforce: root-owned, outside the runner's home
            sudo tar -xzf "$pkg" -C "$BIN" --strip-components=1 --no-same-owner package/claude
            "$BIN/claude" --version
          else
            mkdir -p "$HOME/.local/bin"
            tar -xzf "$pkg" -C "$HOME/.local/bin" --strip-components=1 package/claude
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/claude" --version
          fi

      - name: Install Cursor CLI (pinned by SHA-256)
        if: steps.due.outputs.due == 'true' && matrix.job.runtime == 'cursor-cli'
        env:
          BIN: ${{ steps.blast.outputs.bin }}
        run: |
          pkg="$RUNNER_TEMP/cursor-cli.tgz"
          curl -fsSL "https://downloads.cursor.com/lab/${CURSOR_CLI_VERSION}/linux/x64/agent-cli-package.tar.gz" -o "$pkg"
          echo "${CURSOR_CLI_SHA256}  $pkg" | sha256sum --check --strict
          if [ -n "$BIN" ]; then  # enforce: root-owned, outside the runner's home
            dest="/opt/mission-runtime/cursor-agent/${CURSOR_CLI_VERSION}"
            sudo mkdir -p "$dest"
            sudo tar -xzf "$pkg" -C "$dest" --strip-components=1 --no-same-owner
            sudo ln -sf "$dest/cursor-agent" "$BIN/agent"
            "$BIN/agent" --version
          else
            dest="$HOME/.local/share/cursor-agent/versions/${CURSOR_CLI_VERSION}"
            mkdir -p "$dest" "$HOME/.local/bin"
            tar -xzf "$pkg" -C "$dest" --strip-components=1
            ln -sf "$dest/cursor-agent" "$HOME/.local/bin/agent"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/agent" --version
          fi

      - name: Prepare the checkout (read-only token, this step only)
        if: steps.due.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_ROOT: ${{ steps.blast.outputs.root }}
          RUN_AS: ${{ steps.blast.outputs.run_as }}
          PYTHONPATH: ${{ steps.blast.outputs.pythonpath }}
        run: >-
          python3 -m mission_dispatch prepare --repo "$GITHUB_REPOSITORY"
          --root "$JOB_ROOT" --checks-report "$RUNNER_TEMP/checks" --run-as "$RUN_AS" --provenance "$RUNNER_TEMP/provenance"
          --refusal "$RUNNER_TEMP/refusal/refusal.txt"

      - name: Run the agent (no GitHub token)
        if: steps.due.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ matrix.job.runtime == 'claude-code' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.job.runtime == 'claude-code' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CURSOR_API_KEY: ${{ matrix.job.runtime == 'cursor-cli' && secrets.CURSOR_API_KEY || '' }}
          # App keys by slot, only for the seat whose resources name the slot's app (A2; Amendment 043). The run
          # gives a key to the egress proxy only, and only while "app_gateway" grants an app tool.
          APP_KEY_1: ${{ matrix.job.role == 'A2' && needs.plan.outputs.app_gateway != 'off' && secrets.APP_KEY_1 || '' }}
          JOB_ROOT: ${{ steps.blast.outputs.root }}
          RUN_AS: ${{ steps.blast.outputs.run_as }}
          PYTHONPATH: ${{ steps.blast.outputs.pythonpath }}
          BIN: ${{ steps.blast.outputs.bin }}
        run: >-
          python3 -m mission_dispatch run --root "$JOB_ROOT" --timeout 3600
          --run-as "$RUN_AS" --runtime-dir "$BIN" --refusal "$RUNNER_TEMP/refusal/refusal.txt"

      - name: Check and collect the change (no GitHub token; refuses one containing the model login)
        if: steps.due.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ matrix.job.runtime == 'claude-code' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.job.runtime == 'claude-code' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CURSOR_API_KEY: ${{ matrix.job.runtime == 'cursor-cli' && secrets.CURSOR_API_KEY || '' }}
          APP_KEY_1: ${{ matrix.job.role == 'A2' && needs.plan.outputs.app_gateway != 'off' && secrets.APP_KEY_1 || '' }}  # only to refuse a change holding it
          JOB_ROOT: ${{ steps.blast.outputs.root }}
          PYTHONPATH: ${{ steps.blast.outputs.pythonpath }}
        run: >-
          python3 -m mission_dispatch collect --root "$JOB_ROOT" --out "$RUNNER_TEMP/out"
          --refusal "$RUNNER_TEMP/refusal/refusal.txt"

      - name: Hand the change to the publish job
        if: steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: change-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7

      - name: Keep the run's drafted app calls for HITL's command (MISSION-DISPATCH-001 Amendment 031)
        if: steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drafts-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/out/binding/app-drafts.json
          if-no-files-found: ignore  # none unless the agent drafted a call
          retention-days: 90

      - name: Hand a refusal to the report job (it names what was refused)
        if: failure() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refusal-collect-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/refusal/refusal.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Keep the agent log (scrubbed of the model login)
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-log-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ steps.blast.outputs.root }}/agent.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Hand an out-of-compute record to the report job (pipeline queue)
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capacity-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ steps.blast.outputs.root }}/capacity.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Keep this job's evidence chain (MISSION-DISPATCH-001 §3m; the store replaces this in part 4)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-agent-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: publish ${{ matrix.job.mission_id }} ${{ matrix.job.role }} r${{ matrix.job.round }}
    needs: [plan, agent, baseline]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mission-agent-${{ matrix.job.agent }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      JOB: ${{ toJSON(matrix.job) }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Start this job's evidence chain (MISSION-DISPATCH-001 §3m, ring 6; the agent never sees it)
        env:
          LANE: ${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/evidence"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_RUN=gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-publish-$LANE" >> "$GITHUB_ENV"

      - name: Fetch the agent's change
        id: fetch
        continue-on-error: true  # none when the agent failed or the lane was not due; report handles it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: change-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/artifact

      - name: Fetch the checks results (an A3 PASS needs every check to have exited 0)
        if: steps.fetch.outcome == 'success' && matrix.job.role == 'A3'
        continue-on-error: true  # without them no check is recorded as run, and a PASS is refused under enforce
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checks-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/checks

      - name: Fetch the baseline (a landing check failing on the landing branch alone too; Amendment 052)
        if: steps.fetch.outcome == 'success' && matrix.job.role == 'A3'
        continue-on-error: true  # none unless a landing check failed; without it every failure refuses a PASS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baseline-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/checks

      - name: Name this repository
        id: repo
        if: steps.fetch.outcome == 'success'
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint the agent's App token (this repository, contents + pull requests only)
        id: token
        if: steps.fetch.outcome == 'success'
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Re-check, push the stage branch and open the PR as the agent
        if: steps.fetch.outcome == 'success'
        env:
          READ_TOKEN: ${{ github.token }}
          AGENT_TOKEN: ${{ steps.token.outputs.token }}
          AGENT_SLUG: ${{ steps.token.outputs.app-slug }}
          APP_ID: ${{ vars.APP_ID }}
        run: >-
          python3 -m mission_dispatch publish --repo "$GITHUB_REPOSITORY"
          --root "$RUNNER_TEMP/publish" --artifact "$RUNNER_TEMP/artifact"
          --checks "$RUNNER_TEMP/checks" --refusal "$RUNNER_TEMP/refusal/refusal.txt"

      - name: Hand a refusal to the report job (it names what was refused)
        if: failure() && steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refusal-publish-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/refusal/refusal.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Keep this job's evidence chain (MISSION-DISPATCH-001 §3m; the store replaces this in part 4)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-publish-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

  report:
    name: report ${{ matrix.job.mission_id }} ${{ matrix.job.role }} r${{ matrix.job.round }}
    needs: [plan, publisher, checks, agent, publish]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write  # an AR job reports on the plan PR, which issues: write alone cannot comment on (§3n item 4)
      checks: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      JOB: ${{ toJSON(matrix.job) }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Start this job's evidence chain (MISSION-DISPATCH-001 §3m, ring 6; the agent never sees it)
        env:
          LANE: ${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/evidence"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_RUN=gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-report-$LANE" >> "$GITHUB_ENV"

      - name: Fetch an out-of-compute record
        continue-on-error: true  # none unless the runtime ran out of compute; the run is then reported as a failure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: capacity-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/capacity

      - name: Fetch the publisher job's record (Amendment 054)
        continue-on-error: true  # none unless this seat's App could not mint its token
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cannot-publish-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/cannot-publish

      - name: Fetch a not-started record
        continue-on-error: true  # none unless the lane's own check could not read GitHub (Amendment 050)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: not-started-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/not-started

      - name: Fetch a refusal by the collect step
        continue-on-error: true  # none unless collect refused the change
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: refusal-collect-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/refusal-collect

      - name: Fetch a refusal by the publish step
        continue-on-error: true  # none unless publish refused the change
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: refusal-publish-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/refusal-publish

      - name: Fetch the run's drafted app calls
        continue-on-error: true  # none unless the agent drafted a call (Amendment 031)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drafts-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/drafts

      - name: Post the drafted calls, and record a job that did not end in an open PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m mission_dispatch report --repo "$GITHUB_REPOSITORY" --capacity "$RUNNER_TEMP/capacity/capacity.json"
          --refusal "$RUNNER_TEMP/refusal-collect/refusal.txt" --refusal "$RUNNER_TEMP/refusal-publish/refusal.txt"
          --drafts "$RUNNER_TEMP/drafts/app-drafts.json" --not-started "$RUNNER_TEMP/not-started/not-started.txt"
          --refusal "$RUNNER_TEMP/cannot-publish/refusal.txt"

      - name: Keep this job's evidence chain (MISSION-DISPATCH-001 §3m; the store replaces this in part 4)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-report-${{ matrix.job.mission_id }}-${{ matrix.job.role }}-r${{ matrix.job.round }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

  land:
    name: land ${{ matrix.land.stack_id }}
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.land_count != '0' && needs.plan.outputs.land_count != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mission-agent-${{ matrix.land.agent }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.land_matrix) }}
    env:
      LAND_JOB: ${{ toJSON(matrix.land) }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Name this repository
        id: repo
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint the agent's App token (this repository, contents + pull requests only)
        id: token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Re-check the stack and open its landing PR as the agent
        env:
          READ_TOKEN: ${{ github.token }}
          AGENT_TOKEN: ${{ steps.token.outputs.token }}
          AGENT_SLUG: ${{ steps.token.outputs.app-slug }}
          APP_ID: ${{ vars.APP_ID }}
        run: python3 -m mission_dispatch land --repo "$GITHUB_REPOSITORY"

  # The security scan of an A3 PASS PR or a stack's landing PR (SECURITY-SCAN-SPEC-001 §3; Amendment 036).
  # Reporting only: the router does not wait on the check yet (part 4).
  secscan:
    name: "secscan #${{ matrix.scan.pr }} ${{ matrix.scan.head_sha }}"
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.scan_count != '0' && needs.plan.outputs.scan_count != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    environment: mission-secscan
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.scan_matrix) }}
    env:
      SCAN: ${{ toJSON(matrix.scan) }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Start this job's evidence chain (MISSION-DISPATCH-001 §3m, ring 6; the scanner never sees it)
        env:
          LANE: ${{ matrix.scan.pr }}-${{ matrix.scan.head_sha }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/evidence"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_RUN=gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-secscan-$LANE" >> "$GITHUB_ENV"

      - name: The scanner's own account (the scan needs blast radius enforced)
        run: |
          python3 -m mission_dispatch blast-mode
          if ! grep -qx 'mode=enforce' "$GITHUB_OUTPUT"; then
            echo "::error::the security scan needs blast_radius enforced, so the key can be kept from the scanner"
            exit 1
          fi
          sudo useradd --create-home --shell /bin/bash mission-agent
          sudo cp -a tooling /opt/mission-tooling
          sudo chown -R root:root /opt/mission-tooling
          sudo chmod -R a+rX,go-w /opt/mission-tooling
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 /srv/mission-job
          sudo install -d -o root -g root -m 755 /srv/mission-scan  # the scanner's state and output (Amendment 038)

      - name: Is the scan still due? A fresh clone at the PR's head (read-only token, this step only)
        id: due
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: /opt/mission-tooling/tools/agent_workflow
        run: python3 -m mission_dispatch scan-prepare --repo "$GITHUB_REPOSITORY" --root /srv/mission-job/scan

      - name: Install Node and the scanner (pinned with its whole tree, Amendment 034; never npm)
        if: steps.due.outputs.due == 'true'
        env:
          PYTHONPATH: /opt/mission-tooling/tools/agent_workflow
        run: |
          tools="$RUNNER_TEMP/scan-tools"
          python3 -B -m mission_dispatch tree-install --tool node --dest "$tools"
          python3 -B -m mission_dispatch tree-install --tree codex-security --dest "$tools/codex-security"
          sudo cp -a "$tools" /opt/mission-scan-tools  # root-owned, outside the runner's home
          sudo chown -R root:root /opt/mission-scan-tools
          sudo chmod -R a+rX,go-w /opt/mission-scan-tools

      - name: Run the scan (no GitHub token; the egress proxy holds the key)
        if: steps.due.outputs.due == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: /opt/mission-tooling/tools/agent_workflow
        run: >-
          python3 -m mission_dispatch scan --root /srv/mission-job/scan --tools /opt/mission-scan-tools
          --out "$RUNNER_TEMP/scan-out" --run-as mission-agent --private /srv/mission-scan

      - name: Hand the result to the report job
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-result-${{ matrix.scan.pr }}-${{ matrix.scan.head_sha }}
          path: ${{ runner.temp }}/scan-out/result.json
          if-no-files-found: ignore  # none: the report job sets the check red
          retention-days: 1

      - name: Keep the SARIF and the report (SECURITY-SCAN-SPEC-001 §3, Output)
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-${{ matrix.scan.pr }}-${{ matrix.scan.head_sha }}
          path: |
            ${{ runner.temp }}/scan-out
            /srv/mission-job/scan/scan.log
            /srv/mission-job/scan/egress.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: Keep this job's evidence chain (MISSION-DISPATCH-001 §3m)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-secscan-${{ matrix.scan.pr }}-${{ matrix.scan.head_sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

  secscan-report:
    name: "secscan #${{ matrix.scan.pr }} ${{ matrix.scan.head_sha }} report"
    needs: [plan, secscan]
    if: ${{ !cancelled() && needs.plan.outputs.scan_count != '0' && needs.plan.outputs.scan_count != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write  # the security-scan check on the PR's head
      pull-requests: write  # the comment on the PR
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.scan_matrix) }}
    env:
      SCAN: ${{ toJSON(matrix.scan) }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Start this job's evidence chain (MISSION-DISPATCH-001 §3m)
        env:
          LANE: ${{ matrix.scan.pr }}-${{ matrix.scan.head_sha }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/evidence"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_RUN=gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-secscan-report-$LANE" >> "$GITHUB_ENV"

      - name: Fetch the scan's result
        continue-on-error: true  # without it the check is red: the scan job ended without a result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scan-result-${{ matrix.scan.pr }}-${{ matrix.scan.head_sha }}
          path: ${{ runner.temp }}/scan-result

      # A PR closed, or whose head moved, since the plan gets no check: scan-report looks first.
      - name: Set the security-scan check and post the result (quarantined)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m mission_dispatch scan-report --repo "$GITHUB_REPOSITORY" --result "$RUNNER_TEMP/scan-result"

      - name: Keep this job's evidence chain (MISSION-DISPATCH-001 §3m)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-secscan-report-${{ matrix.scan.pr }}-${{ matrix.scan.head_sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

  # HITL's /mission perform <digest> (MISSION-DISPATCH-001 Amendment 032): performs exactly a run's drafted app
  # calls. The comment only starts the job; check re-derives every mission and reads the command, the report and
  # the run's artifact from the API. No step holds both the token and an app's key: check and report have the token,
  # call has only the app keys. No model login is given and no agent runs.
  perform:
    name: perform
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request && contains(github.event.comment.body, '/mission perform')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One at a time, so a list is claimed by one run only.
    concurrency:
      group: mission-agent-perform
      cancel-in-progress: false
    environment: mission-runtime
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      checks: read
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Start this job's evidence chain (MISSION-DISPATCH-001 §3m, ring 6)
        run: |
          install -d -m 0700 "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/perform-plan" "$RUNNER_TEMP/perform"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_RUN=gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-perform" >> "$GITHUB_ENV"

      - name: Check HITL's command and the drafted list, and claim it
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m mission_dispatch perform --stage check --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/perform-plan"

      # No GitHub token here. Each registered app's key by slot (Amendment 043), in this step's env only; the step
      # gives the proxy only the keys of the apps the drafted list names.
      - name: Make the listed calls through the app gateway, as the service principal
        if: steps.check.outputs.perform == 'true'
        env:
          APP_KEY_1: ${{ secrets.APP_KEY_1 }}
        run: python3 -m mission_dispatch perform --stage call --plan "$RUNNER_TEMP/perform-plan" --out "$RUNNER_TEMP/perform"

      - name: Report which calls were made
        if: always() && steps.check.outputs.perform == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m mission_dispatch perform --stage report --repo "$GITHUB_REPOSITORY"
          --plan "$RUNNER_TEMP/perform-plan" --out "$RUNNER_TEMP/perform"

      - name: Keep this job's evidence chain (MISSION-DISPATCH-001 §3m)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-perform-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

      - name: Keep the app gateway's log and the proxy's log
        if: always() && steps.check.outputs.perform == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perform-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/perform/binding/app-evidence/app-decisions.jsonl
            ${{ runner.temp }}/perform/egress.jsonl
          if-no-files-found: ignore
          retention-days: 90
