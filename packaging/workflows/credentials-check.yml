name: Credentials Check

# Checks the credentials register against every workflow (MISSION-DISPATCH-001 §3i, ring 1):
# each secrets.<NAME> and vars.<NAME> a workflow uses must have a register row naming that
# workflow and job and where the job holds it; a row naming a job that no longer uses it is
# stale; `secrets: inherit`, `toJSON(secrets)` and `secrets[...]` are refused outright.
# Under "identity": "observe" the findings are printed and the job passes; under "enforce" it fails.
# Ring 2 (MISSION-DISPATCH-001 §3k): it also checks every gateway tool description, failing only under
# "permissions": "enforce", and on a PR lists each grant the PR widens against its base (never a failure).
#
# Security model: read-only token, no secrets, no PR text reaches a shell. The check and the
# register are SPEC-002 AUTHORITY, and no agent App may change a workflow.

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  credentials:
    name: Credentials register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out the PR's base, to list the grants the PR widens (MISSION-DISPATCH-001 §3k item 3)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .credentials-check-base
          persist-credentials: false

      - name: Check the register against the workflows
        env:
          BASE_ARGS: ${{ github.event_name == 'pull_request' && '--base .credentials-check-base' || '' }}
        run: PYTHONPATH=tools/agent_workflow python3 -B -m credentials_check --root . $BASE_ARGS
