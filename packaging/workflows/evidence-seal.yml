name: Evidence Seal

# Ring 6 (MISSION-DISPATCH-001 §3m items 2, 3 and 6; Amendment 020, part 4): every 10 minutes, find the ended Mission
# Agent, Mission Router, Credentials Check and Evidence Verify runs whose evidence is not all sealed, seal each job's
# evidence chain from those runs with the evidence key, add the records and seals to the evidence store (config.json
# "evidence_store"), and set the evidence-sealed check on each PR those runs published. Under "evidence": "enforce"
# the router merges an A2 or A3 stage PR only once that check is set.
#
# Security model: the seal job holds the evidence key and the evidence App's key, in the evidence-seal environment
# (deployable from the default branch only), and no other credential: its own token can only read this repository
# and the ended run's artifacts. It handles records only: digests, never agent content. The mark job holds no
# secret; its token can read this repository, set check runs and read PRs. Nothing runs until config.json names the
# store.
#
# The sweep (Amendments 022 and 047) is the only way in: the workflow no longer starts on workflow_run after every run
# of those workflows. Most such runs kept no evidence, and GitHub sends no workflow_run for the Mission Agent runs the
# router starts with its GITHUB_TOKEN anyway. The sweep lists this repository's evidence-* artifacts from the last 2
# days, downloads those of each ended run that the store holds fewer seals for, and seals them. The mark job runs only
# when a sealed run published a PR.

on:
  schedule:
    - cron: "*/10 * * * *"  # the sweep (Amendments 022 and 047)
  workflow_dispatch:  # by hand: copy the runs already in the store to the WORM bucket (backfill), nothing else

permissions: {}

env:
  PYTHONPATH: tooling/tools/agent_workflow

concurrency:
  group: evidence-seal  # one sweep or backfill at a time
  cancel-in-progress: false

jobs:
  seal:
    name: seal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: evidence-seal
    permissions:
      contents: read  # check out this repository's tooling
      actions: read
      pull-requests: read  # the sweep: open stage PRs a sealed run published and no seal job marked (Amendment 049)
      checks: read  # the sweep: whether those PRs' heads have evidence-sealed (Amendment 049)
      id-token: write  # the WORM copy (§3m item 3): GitHub's OIDC token, exchanged for a short-lived cloud token
    outputs:
      store: ${{ steps.store.outputs.full }}
      prs: ${{ steps.count.outputs.prs }}
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Name the evidence store (config.json evidence_store; nothing runs without one)
        id: store
        run: python3 -B -m evidence store-name >> "$GITHUB_OUTPUT"

      - name: Mint the evidence App's token (the evidence store only, contents write only)
        id: token
        if: steps.store.outputs.full != ''
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.EVIDENCE_APP_ID }}
          private-key: ${{ secrets.EVIDENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.store.outputs.name }}
          permission-contents: write

      - name: Find the ended runs whose evidence is not all sealed (the sweep, Amendments 022 and 047)
        if: steps.store.outputs.full != '' && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_TOKEN: ${{ steps.token.outputs.token }}
          STORE: ${{ steps.store.outputs.full }}
        run: python3 -B -m evidence sweep --repo "$GITHUB_REPOSITORY" --store-repo "$STORE" > "$RUNNER_TEMP/sweep.txt"

      - name: Fetch those runs' evidence chains (the sweep)
        if: steps.store.outputs.full != '' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/chains"
          while read -r run attempt; do
            case "$run$attempt" in *[!0-9]*|"") echo "::error::bad sweep line: $run $attempt"; exit 1 ;; esac
            echo "sweep: run $run attempt $attempt"
            gh run download "$run" -R "$GITHUB_REPOSITORY" -p 'evidence-*' -D "$RUNNER_TEMP/chains/$run-$attempt"
          done < "$RUNNER_TEMP/sweep.txt"

      - name: Copy the runs already in the store to the WORM bucket (by hand only)
        if: steps.store.outputs.full != '' && github.event_name == 'workflow_dispatch'
        env:
          STORE_TOKEN: ${{ steps.token.outputs.token }}
          STORE: ${{ steps.store.outputs.full }}
        run: python3 -B -m evidence backfill --store-repo "$STORE"

      - name: Seal each chain and add it to the store
        id: seal
        if: steps.store.outputs.full != '' && github.event_name == 'schedule'
        env:
          EVIDENCE_SEAL_KEY: ${{ secrets.EVIDENCE_SEAL_KEY }}
          STORE_TOKEN: ${{ steps.token.outputs.token }}
          STORE: ${{ steps.store.outputs.full }}
        run: |
          mkdir -p "$RUNNER_TEMP/chains" "$RUNNER_TEMP/sealed"
          python3 -B -m evidence seal --chains "$RUNNER_TEMP/chains" --store-repo "$STORE" --out "$RUNNER_TEMP/sealed/sealed.json" --resume

      # A refused chain fails the seal step, and holds back only its own run's PRs (Amendment 047): the result is still
      # handed over, so the other runs' PRs are marked. No result (the step stopped before writing one) marks nothing.
      - name: Count the PRs to mark
        id: count
        if: always() && github.event_name == 'schedule' && steps.seal.outcome != 'skipped'
        run: |
          if [ -f "$RUNNER_TEMP/sealed/sealed.json" ]; then
            python3 -B -m evidence count --result "$RUNNER_TEMP/sealed/sealed.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the result to the mark job
        if: always() && github.event_name == 'schedule' && steps.count.outputs.prs != '' && steps.count.outputs.prs != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed
          path: ${{ runner.temp }}/sealed/sealed.json
          if-no-files-found: error
          retention-days: 1

  mark:
    name: mark
    needs: seal
    if: >-
      always() && github.event_name == 'schedule' && needs.seal.outputs.store != '' &&
      needs.seal.outputs.prs != '' && needs.seal.outputs.prs != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # check out this repository's tooling
      checks: write
      pull-requests: read
    steps:
      - name: Check out the default branch's tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check the machine is a GitHub-hosted runner or declared (MISSION-DISPATCH-001 §3h item 6)
        env:
          SUBSTRATE_RUNNER: ${{ runner.environment }}
        run: python3 -B -m mission_router.substrate

      - name: Fetch the seal job's result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sealed
          path: ${{ runner.temp }}/sealed

      - name: Set evidence-sealed on each PR a sealed run published (MISSION-DISPATCH-001 §3m item 6)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE: ${{ needs.seal.outputs.store }}
        run: python3 -B -m evidence mark --repo "$GITHUB_REPOSITORY" --result "$RUNNER_TEMP/sealed/sealed.json" --store-repo "$STORE"
